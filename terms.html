<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Terms & Conditions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="news.css">
    <style>
        .page-content-card { 
            background: #0f172a; 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 30px; 
            color: #f8fafc; 
            line-height: 1.8; 
            font-size: 15px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
            text-align: left; 
            min-height: 200px;
        }
        .page-content-card h2 { color: #ffffff; margin-bottom: 16px; font-size: 24px; font-weight: 800; text-align: center; }
        .page-content-card h3 { color: #ffffff; margin-top: 25px; margin-bottom: 12px; font-size: 18px; font-weight: 700; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .page-content-card p { margin-bottom: 16px; color: #cbd5e1; }
        .page-content-card ul { padding-left: 20px; margin-bottom: 16px; color: #cbd5e1; }
        .page-content-card li { margin-bottom: 10px; }
        .loading-state { text-align: center; color: #94a3b8; padding: 40px 0; font-weight: 500; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="app-view">
        <header class="nav-header" style="background: #081B38;">
            <div class="header-left-group">
                <a href="index.html" style="color: white; margin-right: 15px; display: flex; align-items: center;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <h1 class="header-title-text" style="font-size: 18px;">Terms & Conditions</h1>
            </div>
        </header>

        <main class="app-content" style="padding-top: 80px;">
            <div class="page-content-card" id="termsContent">
                <div class="loading-state">Loading Terms & Conditions...</div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://besuad-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Get app_id from URL query or default to app18
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('app_id') || 'app18';

        // Listen for Terms & Conditions updates
        db.ref(appId + '/terms').on('value', (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('termsContent');
            if (data) {
                container.innerHTML = typeof data === 'string' ? data : (data.content || '<p>No terms provided.</p>');
            } else {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">No Terms & Conditions available yet.</p>';
            }
        }, (error) => {
            document.getElementById('termsContent').innerHTML = '<p style="color:#ef4444; text-align:center;">Failed to load Terms & Conditions.</p>';
        });
    </script>
</body>
</html>
